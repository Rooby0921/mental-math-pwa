<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f07f3c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="口算练习" />
    <meta
      name="description"
      content="适配 iPhone 的口算练习网页，支持十几家族专项、借位核心专项、反向凑十和历史记录。"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>口算练习</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">iPhone 口算练习</p>
          <h1>口算练习</h1>
        </div>
        <div class="topbar-actions">
          <button id="openSettingsButton" class="toolbar-button" type="button">设置</button>
          <button id="openReferenceButton" class="toolbar-button" type="button">口诀</button>
          <button id="openHistoryButton" class="toolbar-button" type="button">历史</button>
          <button id="installHintButton" class="toolbar-button" type="button">桌面</button>
        </div>
      </header>

      <section class="question-stage">
        <div class="question-meta">
          <span id="questionModeLabel">10 以内 · 混合 · 随机 · 基础</span>
          <button id="nextQuestionButton" class="text-button" type="button">换一题</button>
        </div>

        <div class="timer-strip">
          <div class="timer-card">
            <span class="status-label">本题计时</span>
            <strong id="liveTimerValue">0.0s</strong>
          </div>
          <div class="timer-card">
            <span class="status-label">上题结果</span>
            <strong id="lastResultValue">未作答</strong>
          </div>
        </div>

        <div class="question-card" aria-live="polite">
          <div class="question-text">
            <span id="questionLeft">7</span>
            <span id="questionOperator">+</span>
            <span id="questionRight">5</span>
            <span>=</span>
          </div>
          <div class="answer-display" id="answerDisplay">?</div>
          <p class="focus-hint" id="focusHint"></p>
          <p class="feedback" id="feedbackMessage">准备好了就开始。</p>
          <div class="mini-stats">
            <span>正确率 <strong id="accuracyValue">0%</strong></span>
            <span>平均用时 <strong id="avgTimeValue">0.0s</strong></span>
            <span>连对 <strong id="streakValue">0</strong></span>
          </div>
        </div>
      </section>

      <section class="keypad-panel">
        <div class="keypad" id="keypad">
          <button class="digit" data-key="1" type="button">1</button>
          <button class="digit" data-key="2" type="button">2</button>
          <button class="digit" data-key="3" type="button">3</button>
          <button class="digit" data-key="4" type="button">4</button>
          <button class="digit" data-key="5" type="button">5</button>
          <button class="digit" data-key="6" type="button">6</button>
          <button class="digit" data-key="7" type="button">7</button>
          <button class="digit" data-key="8" type="button">8</button>
          <button class="digit" data-key="9" type="button">9</button>
          <button class="wide secondary" data-key="clear" type="button">清空</button>
          <button class="digit" data-key="0" type="button">0</button>
          <button class="wide secondary" data-key="backspace" type="button">退格</button>
        </div>
        <button id="submitButton" class="submit-button" type="button">提交答案</button>
      </section>
    </main>

    <dialog id="settingsDialog" class="sheet-dialog">
      <div class="dialog-shell">
        <div class="dialog-header">
          <h2>练习设置</h2>
          <button id="closeSettingsDialog" class="text-button" type="button">关闭</button>
        </div>

        <section class="settings-summary">
          <div>
            <span class="status-label">总题数</span>
            <strong id="sessionSummary">0 题</strong>
          </div>
          <div>
            <span class="status-label">答对</span>
            <strong id="correctCountValue">0</strong>
          </div>
          <div>
            <span class="status-label">答错</span>
            <strong id="wrongCountValue">0</strong>
          </div>
          <div>
            <span class="status-label">错题</span>
            <strong id="mistakeBankValue">0</strong>
          </div>
        </section>

        <section class="settings-section">
          <span class="toolbar-label">题型</span>
          <div class="segmented" id="practiceTypeGroup">
            <button data-value="within10" class="is-active" type="button">10 以内</button>
            <button data-value="within20" type="button">20 以内</button>
            <button data-value="twoDigitOneDigit" type="button">两位数 ± 个位数</button>
          </div>
        </section>

        <section class="settings-section">
          <span class="toolbar-label">运算</span>
          <div class="segmented" id="operationGroup">
            <button data-value="mixed" class="is-active" type="button">混合</button>
            <button data-value="addition" type="button">加法</button>
            <button data-value="subtraction" type="button">减法</button>
          </div>
        </section>

        <section class="settings-section">
          <span class="toolbar-label">出题</span>
          <div class="segmented" id="orderModeGroup">
            <button data-value="random" class="is-active" type="button">随机</button>
            <button data-value="sequence" type="button">顺序</button>
          </div>
        </section>

        <section class="settings-section">
          <span class="toolbar-label">难度</span>
          <div class="segmented" id="difficultyGroup">
            <button data-value="standard" class="is-active" type="button">基础</button>
            <button data-value="level1" type="button">难度 1</button>
            <button data-value="level2" type="button">难度 2</button>
            <button data-value="break10" type="button">突破 10</button>
          </div>
          <p id="difficultyHint" class="toolbar-help">基础：不过滤简单题。</p>
        </section>

        <section class="settings-section">
          <span class="toolbar-label">专项</span>
          <div class="segmented" id="focusModeGroup">
            <button data-value="none" class="is-active" type="button">常规</button>
            <button data-value="teenFamily" type="button">11-19 家族</button>
            <button data-value="borrowCore" type="button">借位核心</button>
            <button data-value="reverseBridge10" type="button">反向凑十</button>
          </div>
          <p id="focusModeHint" class="toolbar-help">
            常规：按你选的题型、运算和难度自由练习。
          </p>
        </section>

        <section class="settings-section" id="teenFamilySection" hidden>
          <span class="toolbar-label">11-19 家族选择</span>
          <div class="segmented teen-family-group" id="teenFamilyGroup">
            <button data-value="mixed" class="is-active" type="button">混合随机</button>
            <button data-value="11" type="button">11</button>
            <button data-value="12" type="button">12</button>
            <button data-value="13" type="button">13</button>
            <button data-value="14" type="button">14</button>
            <button data-value="15" type="button">15</button>
            <button data-value="16" type="button">16</button>
            <button data-value="17" type="button">17</button>
            <button data-value="18" type="button">18</button>
            <button data-value="19" type="button">19</button>
          </div>
        </section>

        <section class="settings-section dialog-actions">
          <button id="resetStatsButton" class="ghost-button warning" type="button">清空统计</button>
          <button id="clearMistakesButton" class="ghost-button" type="button">清空错题</button>
        </section>
      </div>
    </dialog>

    <dialog id="referenceDialog" class="sheet-dialog">
      <div class="dialog-shell">
        <div class="dialog-header">
          <h2>口诀表</h2>
          <button id="closeReferenceDialog" class="text-button" type="button">关闭</button>
        </div>
        <div class="reference-buttons" id="referenceButtons">
          <button data-view="within10" class="is-active" type="button">10 以内加减法</button>
          <button data-view="within20" type="button">20 以内加减法</button>
          <button data-view="multiplication" type="button">9×9 乘法口诀</button>
        </div>
        <div id="referenceContent" class="reference-content"></div>
      </div>
    </dialog>

    <dialog id="historyDialog" class="sheet-dialog wide-sheet">
      <div class="dialog-shell">
        <div class="dialog-header">
          <h2>历史记录</h2>
          <button id="closeHistoryDialog" class="text-button" type="button">关闭</button>
        </div>

        <section class="history-summary">
          <h3>当前薄弱点</h3>
          <div id="weakFactList" class="weak-fact-list"></div>
        </section>

        <section class="history-summary">
          <div class="dialog-actions">
            <button id="clearHistoryButton" class="ghost-button warning" type="button">清空历史</button>
          </div>
        </section>

        <div class="history-table-wrap">
          <table class="history-table">
            <thead>
              <tr>
                <th><button data-sort-key="problem" class="sort-button" type="button">题目</button></th>
                <th><button data-sort-key="responseMs" class="sort-button" type="button">用时</button></th>
                <th><button data-sort-key="isCorrect" class="sort-button" type="button">正误</button></th>
                <th><button data-sort-key="timestamp" class="sort-button" type="button">练习时间</button></th>
              </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>
      </div>
    </dialog>

    <dialog id="installDialog" class="sheet-dialog">
      <div class="dialog-shell">
        <div class="dialog-header">
          <h2>怎么添加到桌面</h2>
          <button id="closeInstallDialog" class="text-button" type="button">关闭</button>
        </div>
        <ol class="install-steps">
          <li>用 Safari 打开这个网页</li>
          <li>点底部“分享”按钮</li>
          <li>选择“添加到主屏幕”</li>
        </ol>
      </div>
    </dialog>

    <script src="./app.js" defer></script>
  </body>
</html>
